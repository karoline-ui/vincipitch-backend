# ═══════════════════════════════════════════════════════════════════════════════
# VinciPitch.AI - Cloud Build para GCP Cloud Run
# ═══════════════════════════════════════════════════════════════════════════════
# 
# Para fazer deploy:
# gcloud builds submit --config cloudbuild.yaml
#
# Ou configure trigger no Cloud Build para deploy automático em push
# ═══════════════════════════════════════════════════════════════════════════════

steps:
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vincipitch-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vincipitch-api:latest'
      - '.'

  # Push da imagem para Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vincipitch-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vincipitch-api:latest'

  # Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vincipitch-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vincipitch-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'  # Altere para sua região preferida
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'APP_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/vincipitch-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/vincipitch-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
